name: Keep Warm Ping

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Live Health Endpoint with Warm DB Query
        run: |
          curl -s -f -m 15 -i "https://vouch-ten-iota.vercel.app/api/health?warm=1" || true
